name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - run: uv venv .venv
      - run: uv pip install --python .venv/bin/python .
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/python scripts/build_session_demo.py --check
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - run: uv venv .venv
      - run: uv pip install --python .venv/bin/python -r requirements-release.txt .
      - run: .venv/bin/playwright install --with-deps chromium
      - run: .venv/bin/python scripts/verify_release.py --browser
      - run: uv build --out-dir .release-scratch/dist
      - run: .venv/bin/python scripts/verify_package.py .release-scratch/dist/*.whl --browser
      - run: .venv/bin/python scripts/verify_sdist.py .release-scratch/dist/*.tar.gz --browser
  web-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --check web/session-app.js
      - run: node --check web/policy-engine.js
      - run: node --check web/policy-editor.js
      - run: node --check web/review-state.js
      - run: node --check web/example-engine.js
      - run: node --check web/example-app.js
      - run: node tests/web-smoke.js
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - run: uv venv .venv
      - run: uv pip install --python .venv/bin/python -r requirements-lint.txt
      - run: .venv/bin/ruff check --no-cache src scripts tests
