[build-system]
requires = ["setuptools==84.2.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "executable-clarifications"
version = "1.2.0"
description = "Turn competing pure-rule interpretations into a boundary example, recorded choice and machine-readable test."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
executable-clarifications = "executable_clarifications.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
executable_clarifications = ["resources/*.json", "resources/implementations/*/*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
